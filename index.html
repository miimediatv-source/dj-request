<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mii-Music · Song Request</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #080810;
    color: #f0eef8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* BACKGROUND GLOW */
  .bg-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-glow::before {
    content: '';
    position: absolute;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(108,63,197,.2) 0%, transparent 65%);
  }
  .bg-glow::after {
    content: '';
    position: absolute;
    bottom: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(236,72,153,.1) 0%, transparent 65%);
  }

  .page { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }

  /* SCREENS */
  .screen { display: none; flex: 1; flex-direction: column; padding: 2rem 1.5rem; max-width: 480px; margin: 0 auto; width: 100%; }
  .screen.active { display: flex; }

  /* LANDING */
  .landing-top {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 0;
  }

  .event-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(108,63,197,.15);
    border: 1px solid rgba(108,63,197,.35);
    border-radius: 100px;
    padding: .35rem 1rem;
    font-size: .72rem;
    color: #a78be8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }
  .event-chip-dot { width: 5px; height: 5px; border-radius: 50%; background: #a78be8; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .dj-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 5rem);
    letter-spacing: 4px;
    color: #fff;
    line-height: 1;
    margin-bottom: .5rem;
  }

  .event-name {
    font-size: .85rem;
    color: #5c5a75;
    letter-spacing: 1px;
    margin-bottom: 2.5rem;
  }

  .landing-prompt {
    font-size: 1.1rem;
    color: #c4c0e0;
    margin-bottom: 2rem;
    font-weight: 300;
  }

  /* TYPE CARDS */
  .type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: 100%;
    margin-bottom: 1.5rem;
  }

  .type-card {
    background: #12121c;
    border: 1.5px solid #2a2840;
    border-radius: 16px;
    padding: 1.75rem 1rem;
    cursor: pointer;
    text-align: center;
    transition: border-color .25s, background .25s, transform .15s;
    position: relative;
    overflow: hidden;
  }

  .type-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .25s;
    border-radius: 14px;
  }

  .type-card.music::before { background: radial-gradient(circle at 50% 0%, rgba(108,63,197,.2), transparent 70%); }
  .type-card.karaoke::before { background: radial-gradient(circle at 50% 0%, rgba(236,72,153,.2), transparent 70%); }

  .type-card:hover::before, .type-card:active::before { opacity: 1; }
  .type-card:hover { transform: translateY(-2px); }
  .type-card:active { transform: scale(.97); }

  .type-card.music:hover { border-color: #6c3fc5; }
  .type-card.karaoke:hover { border-color: #ec4899; }

  .type-emoji { font-size: 2.4rem; margin-bottom: .75rem; display: block; }
  .type-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 2px;
    display: block;
    margin-bottom: .3rem;
  }
  .type-card.music .type-label { color: #a78be8; }
  .type-card.karaoke .type-label { color: #f472b6; }
  .type-sub { font-size: .72rem; color: #4a4860; }

  /* FORM SCREEN */
  .form-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid #1e1e2e;
  }

  .back-btn {
    width: 36px; height: 36px;
    background: #12121c;
    border: 1px solid #2a2840;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    color: #6b6880;
    flex-shrink: 0;
    transition: border-color .2s;
  }
  .back-btn:hover { border-color: #6c3fc5; color: #a78be8; }

  .form-type-badge {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    border-radius: 100px;
    padding: .35rem 1rem;
    font-size: .75rem;
    font-weight: 500;
    letter-spacing: .5px;
  }
  .form-type-badge.music { background: rgba(108,63,197,.15); color: #a78be8; border: 1px solid rgba(108,63,197,.3); }
  .form-type-badge.karaoke { background: rgba(236,72,153,.15); color: #f472b6; border: 1px solid rgba(236,72,153,.3); }

  .field { margin-bottom: 1.25rem; }
  .field-label { font-size: .68rem; letter-spacing: 2px; text-transform: uppercase; color: #44425a; margin-bottom: .5rem; }

  input[type=text] {
    width: 100%;
    background: #12121c;
    border: 1px solid #2a2840;
    border-radius: 10px;
    padding: .85rem 1rem;
    color: #f0eef8;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  input:focus { border-color: #6c3fc5; }
  input::placeholder { color: #34324a; }
  input.karaoke-focus:focus { border-color: #ec4899; }

  .optional-tag {
    display: inline-block;
    font-size: .62rem;
    color: #3a3850;
    background: #1a1828;
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .submit-btn {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
    margin-top: .5rem;
  }
  .submit-btn:active { transform: scale(.98); }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .submit-btn.music { background: linear-gradient(135deg, #6c3fc5, #8b5cf6); color: #fff; }
  .submit-btn.karaoke { background: linear-gradient(135deg, #be185d, #ec4899); color: #fff; }

  /* SUCCESS */
  .success-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .success-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    margin-bottom: 1.5rem;
    animation: popIn .4s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-icon.music { background: rgba(108,63,197,.2); border: 2px solid rgba(108,63,197,.4); }
  .success-icon.karaoke { background: rgba(236,72,153,.2); border: 2px solid rgba(236,72,153,.4); }

  .success-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 3px;
    color: #fff;
    margin-bottom: .5rem;
  }
  .success-song { font-size: 1.1rem; font-weight: 500; color: #c4c0e0; margin-bottom: .25rem; }
  .success-artist { font-size: .85rem; color: #5c5a75; margin-bottom: 2rem; }
  .success-msg { font-size: .85rem; color: #44425a; margin-bottom: 2rem; }

  .another-btn {
    background: #12121c;
    border: 1px solid #2a2840;
    border-radius: 10px;
    color: #a78be8;
    font-family: 'DM Sans', sans-serif;
    font-size: .9rem;
    font-weight: 500;
    padding: .75rem 1.75rem;
    cursor: pointer;
    transition: border-color .2s;
  }
  .another-btn:hover { border-color: #6c3fc5; }

  .error-bar {
    background: rgba(226,75,74,.1);
    border: 1px solid rgba(226,75,74,.3);
    border-radius: 8px;
    padding: .7rem 1rem;
    font-size: .82rem;
    color: #f87171;
    margin-top: .75rem;
    display: none;
  }

  .footer {
    text-align: center;
    padding: 1.5rem;
    font-size: .65rem;
    color: #2a2840;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    font-family: 'Bebas Neue', sans-serif;
    font-size: .75rem;
  }
  .footer span { color: #4a4860; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="page">

  <!-- LANDING -->
  <div class="screen active" id="screen-landing">
    <div class="landing-top">
      <div class="event-chip"><div class="event-chip-dot"></div><span id="l-event">Live Tonight</span></div>
      <div class="dj-name" id="l-djname">Mii-Music</div>
      <div class="event-name" id="l-venue"></div>
      <p class="landing-prompt">What do you want to hear?</p>
      <div class="type-grid">
        <div class="type-card music" onclick="openForm('music')">
          <span class="type-emoji">🎵</span>
          <span class="type-label">Song</span>
          <span class="type-sub">Request a track</span>
        </div>
        <div class="type-card karaoke" onclick="openForm('karaoke')">
          <span class="type-emoji">🎤</span>
          <span class="type-label">Karaoke</span>
          <span class="type-sub">Grab the mic</span>
        </div>
      </div>
    </div>
  </div>

  <!-- SONG REQUEST FORM -->
  <div class="screen" id="screen-form">
    <div class="form-header">
      <div class="back-btn" onclick="goBack()">←</div>
      <div class="form-type-badge music" id="form-badge">🎵 Song Request</div>
    </div>
    <div class="field">
      <div class="field-label">Song name *</div>
      <input type="text" id="f-song" placeholder="e.g. Blinding Lights" autocomplete="off">
    </div>
    <div class="field">
      <div class="field-label">Artist <span class="optional-tag">optional</span></div>
      <input type="text" id="f-artist" placeholder="e.g. The Weeknd" autocomplete="off">
    </div>
    <div class="field">
      <div class="field-label">Your name <span class="optional-tag">optional</span></div>
      <input type="text" id="f-name" placeholder="e.g. Sarah" autocomplete="off">
    </div>
    <div class="field" id="f-performer-wrap" style="display:none">
      <div class="field-label">Performer name *</div>
      <input type="text" id="f-performer" placeholder="Who's singing?" autocomplete="off">
    </div>
    <button class="submit-btn music" id="submit-btn" onclick="submitReq()">Send Request</button>
    <div class="error-bar" id="err-bar">Something went wrong. Please try again.</div>
  </div>

  <!-- SUCCESS -->
  <div class="screen" id="screen-success">
    <div class="success-screen">
      <div class="success-icon music" id="succ-icon">🎵</div>
      <div class="success-title">Request Sent!</div>
      <div class="success-song" id="succ-song"></div>
      <div class="success-artist" id="succ-artist"></div>
      <div class="success-msg">The DJ has your request.<br>Get ready! 🎉</div>
      <button class="another-btn" onclick="goHome()">Send another request</button>
    </div>
  </div>

</div>

<div class="footer">Powered by <span>Mii-Music</span></div>

<script>
  var SUPABASE_URL = 'https://jnltpobmbtnixxumibpv.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_-5kULpzuO7IJUCXqtMUVQA_NPXh66PR';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var currentType = 'music';
  var params = new URLSearchParams(window.location.search);
  var djName = params.get('dj') || 'Mii-Music';
  var eventName = params.get('event') || 'Live Tonight';
  var venue = params.get('venue') || '';

  // Set landing info
  document.getElementById('l-djname').textContent = djName;
  document.getElementById('l-event').textContent = eventName;
  document.getElementById('l-venue').textContent = venue;
  document.title = djName + ' · Song Request';

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
  }

  function openForm(type) {
    currentType = type;
    var isKaraoke = type === 'karaoke';
    var badge = document.getElementById('form-badge');
    badge.textContent = isKaraoke ? '🎤 Karaoke Request' : '🎵 Song Request';
    badge.className = 'form-type-badge ' + type;
    document.getElementById('f-performer-wrap').style.display = isKaraoke ? 'block' : 'none';
    var inputs = document.querySelectorAll('#screen-form input');
    inputs.forEach(function(inp) {
      inp.className = isKaraoke ? 'karaoke-focus' : '';
    });
    var btn = document.getElementById('submit-btn');
    btn.className = 'submit-btn ' + type;
    btn.textContent = isKaraoke ? 'Submit Karaoke Request' : 'Send Song Request';
    document.getElementById('succ-icon').className = 'success-icon ' + type;
    document.getElementById('succ-icon').textContent = isKaraoke ? '🎤' : '🎵';
    document.getElementById('f-song').value = '';
    document.getElementById('f-artist').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-performer').value = '';
    document.getElementById('err-bar').style.display = 'none';
    show('screen-form');
    setTimeout(function(){ document.getElementById('f-song').focus(); }, 300);
  }

  function goBack() { show('screen-landing'); }
  function goHome() { show('screen-landing'); }

  async function submitReq() {
    var song = document.getElementById('f-song').value.trim();
    var artist = document.getElementById('f-artist').value.trim();
    var name = document.getElementById('f-name').value.trim();
    var performer = document.getElementById('f-performer').value.trim();
    if (!song) { document.getElementById('f-song').focus(); return; }
    if (currentType === 'karaoke' && !performer) { document.getElementById('f-performer').focus(); return; }
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    document.getElementById('err-bar').style.display = 'none';
    var payload = {
      song: song,
      artist: artist || null,
      fan_name: name || 'Anonymous',
      status: 'pending',
      type: currentType,
      performer: currentType === 'karaoke' ? (performer || null) : null
    };
    var res = await sb.from('requests').insert([payload]);
    btn.disabled = false;
    btn.textContent = currentType === 'karaoke' ? 'Submit Karaoke Request' : 'Send Song Request';
    if (res.error) {
      document.getElementById('err-bar').style.display = 'block';
      return;
    }
    document.getElementById('succ-song').textContent = song;
    document.getElementById('succ-artist').textContent = artist ? 'by ' + artist : (currentType === 'karaoke' && performer ? 'Performer: ' + performer : '');
    show('screen-success');
  }
</script>
</body>
</html>
